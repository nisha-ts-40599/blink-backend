spring:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.sql.init.autoconfigure.SqlInitializationAutoConfiguration

# Local nodb: OTP on screen + access code unless .env overrides (Gmail test:
# BLINK_OTP_REVEAL=false and BLINK_LOGIN_GATE empty).
blink:
  otp-reveal: ${BLINK_OTP_REVEAL:true}
  login-gate: ${BLINK_LOGIN_GATE:talentserv-blink}
