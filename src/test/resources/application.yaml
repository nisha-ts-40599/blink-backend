spring:
  datasource:
    url: jdbc:h2:mem:blink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        boot:
          allow_jdbc_metadata_access: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

blink:
  automation-sdlc-path: src/test/resources/automation_sdlc
